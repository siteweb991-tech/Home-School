<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecteur PDF | Home School</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="style.css"><style>body{background:#edf2f7}.reader-header{background:#fffaf3;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 3%;border-bottom:1px solid #e2e7ef}.reader-header .brand img{width:60px}.reader-header .brand div{font-size:25px}.reader-back{font-size:12px}.reader-toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:18px 3%;background:#fff}.reader-toolbar>div{flex:1;min-width:0}.reader-toolbar h1{font:700 19px/1.4 'DM Sans',Arial;margin:0 0 6px}.reader-toolbar p{font-size:11px;color:#8291a3;margin:0}.reader-actions{display:flex;gap:9px;flex-wrap:wrap}.reader-actions a{display:inline-block;font-size:12px;padding:11px 16px;border-radius:8px;white-space:nowrap}.reader-actions a:first-child{border:1px solid #d8e2ec;color:#42688c}.reader-actions a:last-child{background:#ce962e;color:white}iframe{display:block;width:100%;height:calc(100dvh - 178px);min-height:500px;border:0;background:#dce3ed}.reader-error{text-align:center;padding:70px 20px}@media(max-width:650px){.reader-header{padding:13px 18px;gap:10px}.reader-header .brand div{font-size:21px}.reader-header .brand img{width:48px}.reader-back{font-size:10px}.reader-toolbar{padding:18px;display:block}.reader-toolbar h1{font-size:16px}.reader-actions{margin-top:15px}.reader-actions a{font-size:11px}iframe{height:calc(100dvh - 240px);min-height:450px}}.pdf-controls{display:flex;gap:10px;align-items:center;justify-content:center;background:#f8fafc;border-block:1px solid #e0e7ef;padding:10px;position:sticky;top:0;z-index:3}.pdf-controls button{border:1px solid #d4dfeb;border-radius:6px;background:white;color:#234d73;min-width:34px;height:32px}.pdf-controls button:disabled{opacity:.35;cursor:default}.pdf-controls label{flex-direction:row;align-items:center;gap:7px;font-size:11px}.pdf-controls input{width:50px;padding:6px;text-align:center;font-size:12px}.pdf-controls>span{font-size:12px;color:#58708a}.control-divider{height:22px;border-left:1px solid #d9e2ec;margin:0 8px}#reader-pages{padding:22px 16px 40px;overflow:auto;min-height:65vh;background:#e0e6ee}#pdf-canvas{display:block;margin:auto;background:#fff;box-shadow:0 5px 25px #17334f20}#pdf-status{font-size:12px;text-align:center;background:#f8fafc;padding:8px;margin:0;color:#677c93}#pdf-status:empty{display:none}@media(max-width:520px){.pdf-controls{gap:6px;padding:10px 5px}.pdf-controls button{min-width:29px}.pdf-controls input{width:43px}.control-divider{margin:0 3px}#reader-pages{padding:15px 9px 30px}.pdf-controls>span{font-size:11px}}</style></head><body><script src="header.js"></script><main id="reader"><div class="reader-toolbar"><div><h1 id="document-title">Votre document PDF</h1><p>Copie locale · Consultation et téléchargement</p></div><div class="reader-actions"><a id="open-pdf" target="_blank" rel="noopener">Ouvrir le PDF ↗</a><a id="download-pdf" download>Télécharger ↓</a></div></div><div class="pdf-controls" aria-label="Navigation dans le PDF"><button id="previous-page" aria-label="Page précédente" disabled>←</button><label>Page <input id="page-number" type="number" min="1" value="1" aria-label="Numéro de page"></label><span id="page-total">/ …</span><button id="next-page" aria-label="Page suivante" disabled>→</button><span class="control-divider"></span><button id="zoom-out" aria-label="Réduire le zoom">−</button><span id="zoom-value">100 %</span><button id="zoom-in" aria-label="Agrandir le document">+</button></div><p id="pdf-status" role="status">Chargement du document…</p><div id="reader-pages"><canvas id="pdf-canvas" aria-label="Page du document PDF"></canvas></div></main><script src="app.js"></script><script type="module" src="lecteur.js"></script></body></html>
